services:
  aether:
    build:
      context: .
      args:
        APP_BASE_PATH: /
    ports:
      - "8016:8000"
    env_file: .env
    environment:
      OLLAMA_BASE_URL: http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - aether-data:/app/.aether
    init: true
    restart: unless-stopped

volumes:
  aether-data:
